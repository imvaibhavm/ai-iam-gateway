services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai_iam_postgres
    environment:
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: ai
      POSTGRES_DB: ai_iam
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ai_iam_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:

